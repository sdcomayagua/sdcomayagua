name: Sincronizar catálogo público Gamer Comayagua
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_catalog_photos.py'
      - 'scripts/sync_public_catalog.py'
      - 'data/catalogo-api.url'
      - 'data/catalogo-csv.url'
      - '.github/workflows/catalogo-sync.yml'
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
permissions:
  contents: write
concurrency:
  group: gamer-comayagua-catalog-sync
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar integridad del sincronizador
        run: python3 -m py_compile scripts/sync_public_catalog.py
      - name: Actualizar catálogo desde la API pública de solo lectura
        run: python3 scripts/sync_public_catalog.py
      - name: Preparar fotos públicas para catálogos en imagen y PDF
        run: python3 scripts/sync_catalog_photos.py
      - name: Guardar cambios en GitHub Pages
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/catalogo-respaldo.json data/catalogo-inicial.js data/catalogo-fotos.json assets/catalog)" ]; then
            echo "No hay cambios de inventario."
            exit 0
          fi
          git config user.name "Gamer Comayagua Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogo-respaldo.json data/catalogo-inicial.js data/catalogo-fotos.json assets/catalog
          git commit -m "Actualizar inventario desde catálogo público Google Sheets"
          git push

