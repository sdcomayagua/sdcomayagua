name: Verificar tienda y buscador
on:
  push:
    paths-ignore: ['data/catalogo-respaldo.json', 'data/catalogo-inicial.js']
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript y Apps Script
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
          node --check sw.js
          for file in apps-script/*.gs; do node --check < "$file"; done
      - name: Verificar catálogo, carrito y búsquedas sin servicios externos
        run: |
          node tests/test-admin-session.js
          node tests/test-server-sessions.js
          node tests/test-admin-quality.js
          node tests/test-commercial-tools.js
          node tests/test-bank-loading.js
          node tests/test-api.js
          node tests/test-native-panel.js
          node tests/test-cart.js
          node tests/test-cart-storage.js
          node tests/test-homepage.js
          node tests/test-compare-model.js
          node tests/test-pwa-safety.js
          node tests/test-offers.js
          node tests/test-finance.js
          node tests/test-product-trash.js
          node tests/test-catalog.js
          node tests/test-free-research.js
          node tests/test-model.js
          node tests/test-selected-research.js
          node tests/test-bulk.js
          node tests/test-reference-photos.js
          node tests/test-management.js
          node tests/test-inventory.js
          node tests/test-photo-editor.js
          node tests/test-photo-download.js
          node tests/test-category-codes.js
          node tests/test-photo-recognition.js
          node tests/test-product-search.js
          python3 tests/test-sync.py
          python3 tests/test-catalog-photos.py
          python3 tests/test-product-seo.py
          python3 scripts/verify_public_backup.py
          python3 scripts/report_catalog_quality.py --csv /tmp/revision-productos.csv --json /tmp/calidad-resumen.json

      - name: Preparar navegador para verificar el panel
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verificar edición, búsqueda y fotos en computadora y celular
        run: |
          node tests/test-editor-tools-ui.js
          node tests/test-product-search-ui.js
          node tests/test-shipping-ui.js
          node tests/test-category-export-ui.js
          node tests/test-offers-ui.js
          node tests/test-finance-ui.js
          node tests/test-ui.js
          node tests/test-home-ui.js
          node tests/test-session-payments-ui.js
          node tests/test-session-token-ui.js
      - name: Capturar pantallas y verificar contraste visual
        env:
          GC_VISUAL_ARTIFACTS: artifacts/visual
        run: node tests/test-visual-guardrails.js
      - name: Adjuntar capturas de PC y celular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-visual-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 14
