<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SD COMAYAGUA | Panel Privado</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <header class="top-header">
        <div class="brand">
            <h1 class="logo-text">SD COMAYAGUA</h1>
            <span class="subtitle">Panel Privado</span>
        </div>
        <div class="header-actions">
            <button id="btnSync" class="btn-icon" title="Sincronizar"><i class="icon-sync"></i></button>
            <button id="btnTheme" class="btn-icon" title="Cambiar Tema"><i class="icon-moon"></i></button>
        </div>
    </header>

    <main id="app-content">
        <section id="view-dashboard" class="view active">
            <div class="dashboard-grid">
                </div>
            <div class="quick-actions">
                <button class="btn btn-primary" onclick="app.navigate('pos')">Nueva Venta</button>
                <button class="btn btn-secondary" onclick="app.navigate('products')">Inventario</button>
            </div>
        </section>

        <section id="view-products" class="view hidden">
            <div class="toolbar">
                <input type="search" id="searchProducts" placeholder="Buscar productos..." class="input-search">
                <button class="btn btn-primary">+ Nuevo</button>
            </div>
            <div id="product-list" class="product-grid"></div>
        </section>

        <section id="view-pos" class="view hidden">
            <div class="pos-layout">
                <div class="pos-products">
                    <input type="search" id="searchPos" placeholder="Agregar al carrito..." class="input-search">
                    <div id="pos-search-results" class="results-list"></div>
                </div>
                <div class="pos-cart">
                    <div id="cart-items" class="cart-items"></div>
                    <div class="cart-totals">
                        <div class="summary-row"><span>Subtotal:</span> <span id="cart-subtotal">Lps. 0</span></div>
                        <div class="summary-row">
                            <select id="shippingType" class="input-select">
                                <option value="normal">Envío Normal (Lps. 110)</option>
                                <option value="cod">Pagar al Recibir</option>
                            </select>
                        </div>
                        <div class="summary-row" id="row-cod-fee" style="display:none;">
                            <span>Comisión (6%):</span> <span id="cart-commission">Lps. 0</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>Total Final:</span> <span id="cart-total">Lps. 0</span>
                        </div>
                    </div>
                    <div class="customer-data">
                        <input type="text" id="custName" placeholder="Nombre del Cliente" class="input-field">
                        <input type="tel" id="custPhone" placeholder="Teléfono" class="input-field">
                        </div>
                    <div class="cart-actions">
                        <button class="btn btn-secondary" id="btnSaveQuote">Guardar Cotización</button>
                        <button class="btn btn-primary" id="btnProcessSale">Procesar Venta</button>
                    </div>
                </div>
            </div>
        </section>
        
        </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="dashboard">
            <i class="icon-home"></i><span>Dashboard</span>
        </button>
        <button class="nav-item" data-target="products">
            <i class="icon-box"></i><span>Productos</span>
        </button>
        <button class="nav-item" data-target="pos">
            <i class="icon-cart"></i><span>POS</span>
        </button>
        <button class="nav-item" data-target="invoices">
            <i class="icon-file"></i><span>Facturas</span>
        </button>
        <button class="nav-item" data-target="settings">
            <i class="icon-cog"></i><span>Ajustes</span>
        </button>
    </nav>

    <div id="invoice-export-container" class="invoice-export">
        </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/state.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/pos.js"></script>
    <script src="assets/js/invoices.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
